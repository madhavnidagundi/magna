[package]
name = "misal"
version = "0.1.0"
edition = "2021"
description = "Hardware-agnostic inference engine optimization CLI"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
magna-middleware = { version = "0.2.0", path = "../middleware" }
tokio = { version = "1.36", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"
tonic = "0.12"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[features]
default = []
nvidia = ["magna-middleware/nvidia"]
qualcomm = ["magna-middleware/qualcomm"]
ti = ["magna-middleware/ti"]
rockchip = ["magna-middleware/rockchip"]
cpu = ["magna-middleware/cpu"]
