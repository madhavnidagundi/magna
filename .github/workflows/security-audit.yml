name: Security Audit

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'middleware/Cargo.toml'
      - 'client/Cargo.toml'
      - 'deny.toml'
      - 'Makefile'
      - '.github/workflows/security-audit.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'middleware/Cargo.toml'
      - 'client/Cargo.toml'
      - 'deny.toml'
      - 'Makefile'
      - '.github/workflows/security-audit.yml'
  schedule:
    # Run weekly on Sunday at 00:00 UTC to catch new vulnerabilities
    - cron: '0 0 * * 0'

permissions:
  contents: read
  packages: read
  checks: write

jobs:
  cargo-audit:
    name: Cargo Audit (Vulnerability Scan)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/magna-global/mi-isal/develop:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Run security audit
        run: |
          export CARGO_HOME=/home/vscode/.cargo
          export RUSTUP_HOME=/home/vscode/.rustup
          export PATH="/home/vscode/.cargo/bin:$PATH"
          make audit

  cargo-deny:
    name: Cargo Deny (Policy Enforcement)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/magna-global/mi-isal/develop:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo deny
        run: |
          export CARGO_HOME=/home/vscode/.cargo
          export RUSTUP_HOME=/home/vscode/.rustup
          export PATH="/home/vscode/.cargo/bin:$PATH"
          make deny
