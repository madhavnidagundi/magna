[advisories]
version = 2
# Note: Security vulnerabilities are treated as errors by default in newer versions of cargo-deny
# Warn on unmaintained direct/workspace dependencies
unmaintained = "workspace"
# Don't fail on unsound crates (many false positives)
unsound = "none"
# Deny yanked crates to prevent using removed versions
yanked = "deny"
# Exceptions for false positives or inapplicable advisories - add entries with a
# comment explaining the accepted risk, e.g.:
# { id = "RUSTSEC-0000-0000", reason = "Not applicable because ..." }
ignore = []

[licenses]
version = 2
# Warn if an allowed license is not used by any crate, instead of failing
unused-allowed-license = "warn"
# Allow common open-source licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "NCSA",
    "Unicode-3.0",
    "ISC",
    "CDLA-Permissive-2.0",
]

[bans]
# Warn on multiple versions of the same crate
multiple-versions = "warn"
# Deny specific crates (wildcards allowed)
deny = [
    # Example: { name = "openssl", wrappers = ["openssl-sys"] }
]
# Skip checking certain crates for duplicates
skip = []
# Skip trees of certain crates
skip-tree = []

[sources]
# Fail if dependencies come from unknown registries
unknown-registry = "deny"
# Fail if dependencies come from Git repositories
unknown-git = "deny"
# Allow crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow specific Git repos if needed
allow-git = []
