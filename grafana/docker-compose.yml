services:
  # Simulates the Magna middleware metrics endpoint.
  # Replace this with the real middleware when deploying to production.
  metrics-simulator:
    build:
      context: ./metrics-simulator
      dockerfile: Dockerfile
    image: magna-metrics-simulator:latest
    container_name: magna-metrics-simulator
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - magna-monitoring

  prometheus:
    build:
      context: ./prometheus
      dockerfile: Dockerfile
    image: magna-prometheus:latest
    container_name: magna-prometheus
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - metrics-simulator
    restart: unless-stopped
    networks:
      - magna-monitoring

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    image: magna-grafana:latest
    container_name: magna-grafana
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - magna-monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  magna-monitoring:
    driver: bridge
