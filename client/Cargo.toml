[package]
name = "magna-client"
version = "0.2.0"
edition = "2021"
description = "Edge Camera gRPC Client for Magna Inference"
license = "MIT"

[dependencies]
magna-middleware = { path = "../middleware" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive"] }
tonic = "0.12"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time"] }
image = "0.25"
parking_lot = "0.12"
rayon = "1.10"

[dependencies.turbojpeg]
version = "1.0"
optional = true

[dependencies.v4l]
version = "0.14.0"
optional = true

[features]
default = ["camera"]
camera = ["v4l", "turbojpeg"]
